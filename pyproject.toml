[project]
name = "dailyslop"
version = "0.6.0"
description = "Discord bot that consolidates and reformats daily game scores into per-game leaderboards."
requires-python = ">=3.11"
dependencies = [
    "discord.py",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
